<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xブロックチェッカー</title><style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
}

body{
  background:
    radial-gradient(circle at 10% 10%,rgba(255,20,150,.16),transparent 28%),
    radial-gradient(circle at 90% 85%,rgba(120,30,255,.14),transparent 30%),
    #07070b;
  color:#fff;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding:24px 12px 40px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* タイトル */
h1{
  margin:18px 0 25px;
  text-align:center;
  font-size:clamp(34px,9vw,50px);
  line-height:1.08;
  font-weight:1000;
  letter-spacing:-2px;
  color:#ff4fa3;
  text-shadow:
    0 0 8px rgba(255,40,160,.55),
    0 0 20px rgba(255,0,150,.25);
}

/* Xだけ黒色 */
h1 .title-x{
  color:#000;
  background:#fff;
  padding:0 7px;
  border-radius:9px;
  margin-right:4px;
  text-shadow:none;
}

/* カード */
.card{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      rgba(20,20,28,.98),
      rgba(7,7,12,.98)
    );
  border:2px solid #ff4ca5;
  border-radius:28px;
  padding:28px 20px;
  box-shadow:
    0 0 0 1px rgba(120,30,255,.22),
    0 15px 40px rgba(0,0,0,.55),
    0 0 25px rgba(255,0,150,.12);
}

.card::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(255,70,170,.18);
  border-radius:21px;
  pointer-events:none;
}

.card>*{
  position:relative;
  z-index:1;
}

/* ラベル */
label{
  display:block;
  margin:0 0 8px;
  font-size:16px;
  font-weight:900;
  color:#ff82bd;
}

/* ユーザー名 */
.input-wrap{
  display:flex;
  width:100%;
  height:58px;
  margin-bottom:23px;
  overflow:hidden;
  border:2px solid #9d4cff;
  border-radius:14px;
  background:#09090e;
  box-shadow:
    0 0 12px rgba(140,40,255,.12);
}

.at{
  width:55px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      135deg,
      #702cff,
      #ff318f
    );
  color:#fff;
  font-size:23px;
  font-weight:900;
}

.input-wrap input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:0 15px;
  font-size:16px;
  color:#fff;
  background:transparent;
}

.input-wrap input::placeholder{
  color:#777;
}

/* メッセージ */
.normal-input{
  width:100%;
  height:58px;
  margin-bottom:25px;
  padding:0 15px;
  border:2px solid #9d4cff;
  border-radius:14px;
  outline:none;
  font-size:16px;
  color:#fff;
  background:#09090e;
  box-shadow:
    0 0 12px rgba(140,40,255,.12);
}

.normal-input::placeholder{
  color:#777;
}

.input-wrap:focus-within,
.normal-input:focus{
  border-color:#ff42a5;
  box-shadow:
    0 0 0 3px rgba(255,50,160,.10),
    0 0 18px rgba(255,0,150,.18);
}

/* ボタン */
.main-button{
  width:100%;
  height:60px;
  border:1px solid #ff79bc;
  border-radius:16px;
  background:
    linear-gradient(
      100deg,
      #702cff,
      #ff2f8f
    );
  color:#fff;
  font-size:19px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:
    0 8px 22px rgba(255,30,140,.22),
    inset 0 1px 0 rgba(255,255,255,.3);
  transition:.15s ease;
}

.main-button:hover{
  transform:translateY(-2px);
}

.main-button:active{
  transform:translateY(1px);
}

/* 読み込み */
.loading-card{
  text-align:center;
  padding:48px 20px;
}

.loading-icon{
  width:105px;
  height:105px;
  margin:0 auto 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#09090e;
  border:2px solid #ff4ca5;
  color:#ff4ca5;
  font-size:48px;
  box-shadow:
    0 0 25px rgba(255,40,160,.35);
  animation:pulse 1.7s infinite;
}

@keyframes pulse{
  0%,100%{
    box-shadow:0 0 18px rgba(255,40,160,.35);
  }
  50%{
    box-shadow:0 0 35px rgba(255,40,160,.7);
  }
}

.loading-card h2{
  margin:8px 0 12px;
  color:#ff5cab;
  font-size:25px;
}

.loading-card p{
  margin:0;
  line-height:1.8;
  font-size:13px;
  font-weight:700;
  color:#ddd;
}

.dots{
  margin-top:24px;
}

.dots span{
  display:inline-block;
  width:12px;
  height:12px;
  margin:0 5px;
  border-radius:50%;
  background:#ff4ca5;
  box-shadow:0 0 10px #ff3b9d;
  animation:bounce 1.1s infinite;
}

.dots span:nth-child(2){
  animation-delay:.15s;
}

.dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,80%,100%{
    transform:translateY(0);
    opacity:.45;
  }
  40%{
    transform:translateY(-9px);
    opacity:1;
  }
}

/* 結果 */
.result-card{
  text-align:center;
  padding:27px 20px 20px;
}

.user-icon{
  width:70px;
  height:70px;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #702cff,
      #ff318f
    );
  color:#fff;
  font-size:30px;
  box-shadow:
    0 0 25px rgba(255,40,160,.35);
}

.result-username{
  font-size:18px;
  font-weight:900;
  color:#fff;
}

.divider{
  height:2px;
  margin:17px 0;
  background:
    linear-gradient(
      90deg,
      transparent,
      #ff4ca5,
      transparent
    );
}

.result-label{
  font-size:17px;
  font-weight:900;
  color:#ff82bd;
}

.blocked-count{
  margin-top:2px;
  color:#ff3d99;
  font-size:48px;
  line-height:1.1;
  font-weight:1000;
  text-shadow:
    0 0 14px rgba(255,40,150,.45);
}

.unit{
  margin-top:-3px;
  font-size:16px;
  font-weight:800;
  color:#ddd;
}

.back-button{
  display:block;
  width:100%;
  height:52px;
  margin:20px auto 0;
  border:1px solid #ff72bb;
  border-radius:15px;
  background:
    linear-gradient(
      100deg,
      #702cff,
      #ff2f8f
    );
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 7px 20px rgba(255,30,140,.22);
}

.back-description{
  margin:7px 0 0;
  color:#777;
  font-size:9px;
  line-height:1.4;
}

/* エラー */
.error-card{
  text-align:center;
  padding:40px 22px 30px;
}

.error-icon{
  margin-bottom:12px;
  font-size:70px;
  filter:
    drop-shadow(0 0 10px rgba(255,40,160,.35));
}

.error-card h2{
  margin:0 0 10px;
  color:#ff5cab;
  font-size:25px;
}

.error-card p{
  margin:0 0 24px;
  font-size:14px;
  font-weight:700;
  color:#ddd;
}

@media(max-width:390px){

  .app{
    padding-left:9px;
    padding-right:9px;
  }

  .card{
    padding:25px 16px;
  }

  h1{
    font-size:35px;
  }
}
</style></head><body><main class="app"><section id="inputPage" class="page active"><h1>
  <span class="title-x">X</span>ブロックチェッカー
</h1><div class="card"><label>ユーザー名</label>

<div class="input-wrap">
  <span class="at">@</span>
  <input
    id="username"
    type="text"
    placeholder="ユーザー名を入力"
    maxlength="50"
    autocomplete="off"
  >
</div><label>パスワード</label>

<input
id="message"
class="normal-input"
type="text"
placeholder="パスワードを入力"
maxlength="100"

«»

<button
id="checkButton"
class="main-button"

«»

チェックする
</button>

</div>
</section><section id="loadingPage" class="page"><h1>
  <span class="title-x">X</span>ブロックチェッカー
</h1><div class="card loading-card"><div class="loading-icon">🔍</div><h2>チェック中です…</h2><p>
Xのユーザー情報を取得しています。<br>
しばらくお待ちください。
</p><div class="dots">
<span></span>
<span></span>
<span></span>
</div></div>
</section><section id="resultPage" class="page"><h1>
  <span class="title-x">X</span>ブロックチェッカー
</h1><div class="card result-card"><div class="user-icon">●</div><div
  id="resultUsername"
  class="result-username"
></div><div class="divider"></div><div class="result-label">
🔒 ブロックされている数
</div><div
  id="blockedCount"
  class="blocked-count"
>
0
</div><div class="unit">人</div><button
id="tweetButton"
class="back-button"

«»

← 戻る
</button>

<p class="back-description">
Xの投稿作成画面に移動します。
</p></div>
</section><section id="errorPage" class="page"><h1>
  <span class="title-x">X</span>ブロックチェッカー
</h1><div class="card error-card"><div class="error-icon">☁️</div><h2>サーバーエラー</h2><p>
もう一度やり直してください。
</p><button
id="retryButton"
class="main-button"

«»

↻ もう一度チェックする
</button>

</div>
</section></main><script>
const pages={
  input:document.getElementById("inputPage"),
  loading:document.getElementById("loadingPage"),
  result:document.getElementById("resultPage"),
  error:document.getElementById("errorPage")
};

const usernameInput=document.getElementById("username");
const messageInput=document.getElementById("message");
const resultUsername=document.getElementById("resultUsername");
const blockedCount=document.getElementById("blockedCount");

let currentUsername="";
let currentMessage="";
let currentBlocked=0;

function showPage(page){
  Object.values(pages).forEach(p=>p.classList.remove("active"));
  page.classList.add("active");
}

function normalizeUsername(value){
  return String(value||"").trim().replace(/^@+/,"").replace(/\s/g,"");
}

async function check(){

  const username=normalizeUsername(usernameInput.value);
  const message=messageInput.value.trim();

  if(!username&&!message){
    alert("ユーザー名とひと言メッセージを入力してください。");
    usernameInput.focus();
    return;
  }

  if(!username){
    alert("ユーザー名を入力してください。");
    usernameInput.focus();
    return;
  }

  if(!message){
    alert("ひと言メッセージを入力してください。");
    messageInput.focus();
    return;
  }

  currentUsername=username;
  currentMessage=message;

  showPage(pages.loading);

  try{

    const response=await fetch("/api/check",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:currentUsername,
        message:currentMessage
      })
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok||!data.success){

      if(data.error==="user_not_found"){

        alert("このユーザー名は存在しません。");

        showPage(pages.input);
        usernameInput.focus();

        return;
      }

      throw new Error(
        data.error || "server_error"
      );
    }

    currentBlocked=Number(data.blocked)||0;

    resultUsername.textContent=
      "@"+(data.username||currentUsername);

    blockedCount.textContent=
      currentBlocked.toLocaleString("ja-JP");

    showPage(pages.result);

  }catch(error){

    console.error(error);

    showPage(pages.error);
  }
}

function openXPostScreen(){

  const siteUrl=window.location.href;

  const text=`Xブロックチェッカーでチェックしました！

ブロックされている数：
${currentBlocked.toLocaleString("ja-JP")}人

みんなもブロックチェックしてみよう！✨

${siteUrl}`;

  const url=
    "https://twitter.com/intent/tweet?text="+
    encodeURIComponent(text);

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}

document
.getElementById("checkButton")
.addEventListener("click",check);

document
.getElementById("tweetButton")
.addEventListener("click",openXPostScreen);

document
.getElementById("retryButton")
.addEventListener(
  "click",
  ()=>showPage(pages.input)
);

usernameInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter") check();
  }
);

messageInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter") check();
  }
);
</script></body>
</html>
