<script>

const pages={
  input:document.getElementById("inputPage"),
  loading:document.getElementById("loadingPage"),
  result:document.getElementById("resultPage"),
  error:document.getElementById("errorPage")
};

const usernameInput=
  document.getElementById("username");

const messageInput=
  document.getElementById("message");

const resultUsername=
  document.getElementById("resultUsername");

const blockedCount=
  document.getElementById("blockedCount");

let currentUsername="";
let currentBlocked=0;


function showPage(page){

  Object.values(pages).forEach(p=>{
    p.classList.remove("active");
  });

  page.classList.add("active");
}


function normalizeUsername(value){

  return String(value || "")
    .trim()
    .replace(/^@+/,"")
    .replace(/\s/g,"");

}


async function check(){

  const username=
    normalizeUsername(usernameInput.value);

  const message=
    messageInput.value.trim();


  if(!username && !message){

    alert(
      "ユーザー名とひと言メッセージを入力してください。"
    );

    usernameInput.focus();

    return;
  }


  if(!username){

    alert("ユーザー名を入力してください。");

    usernameInput.focus();

    return;
  }


  if(!message){

    alert("ひと言メッセージを入力してください。");

    messageInput.focus();

    return;
  }


  currentUsername=username;

  showPage(pages.loading);


  try{

    const response=
      await fetch("/api/check",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          username:currentUsername,

          message:message

        })

      });


    const data=
      await response.json().catch(()=>({}));


    if(!response.ok || !data.success){

      if(data.error==="user_not_found"){

        alert(
          "このユーザー名は存在しません。"
        );

        showPage(pages.input);

        usernameInput.focus();

        return;
      }


      throw new Error(
        data.error || "server_error"
      );

    }


    currentBlocked=
      Number(data.blocked) || 0;


    resultUsername.textContent=
      "@" + (data.username || currentUsername);


    blockedCount.textContent=
      currentBlocked.toLocaleString("ja-JP");


    showPage(pages.result);


  }catch(error){

    console.error(error);

    showPage(pages.error);

  }

}


function openXPostScreen(){

  const username =
    normalizeUsername(
      currentUsername
    );


  const shareUrl =
    window.location.origin +
    "/share?username=" +
    encodeURIComponent(username) +
    "&blocked=" +
    encodeURIComponent(currentBlocked);


  const text =
`Xブロックチェッカーでチェックしました！

ブロックされている数：
${currentBlocked.toLocaleString("ja-JP")}人

あなたもブロック数をチェックしよう！

${shareUrl}`;


  const url =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text);


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


document
  .getElementById("checkButton")
  .addEventListener("click",check);


document
  .getElementById("tweetButton")
  .addEventListener(
    "click",
    openXPostScreen
  );


document
  .getElementById("retryButton")
  .addEventListener(
    "click",
    ()=>showPage(pages.input)
  );


usernameInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      check();
    }
  }
);


messageInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      check();
    }
  }
);

</script>
