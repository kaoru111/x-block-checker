<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xブロックチェッカー</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Sans",
        "Meiryo",
        sans-serif;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255, 60, 160, 0.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(120, 40, 255, 0.16),
            transparent 30%
        ),
        #08080d;

    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 380px;

    background:
        linear-gradient(
            145deg,
            #17171f,
            #0a0a0f
        );

    border: 2px solid #ff4fa5;
    border-radius: 28px;

    padding: 28px 20px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(255, 50, 160, 0.15);

    text-align: center;
}

/* タイトル */

.title {
    margin-bottom: 28px;

    font-size: 30px;
    line-height: 1.2;
    font-weight: 1000;
    letter-spacing: -1px;

    color: #ff5aa9;

    text-shadow:
        0 0 10px rgba(255, 50, 160, 0.4);
}

.title-x {
    display: inline-block;

    margin-right: 4px;
    padding: 0 6px;

    color: #000;
    background: #fff;

    border-radius: 7px;

    text-shadow: none;
}

/* フォーム */

form {
    display: block;
    width: 100%;
}

.form-group {
    display: block;

    width: 100%;

    margin-bottom: 20px;

    text-align: left;

    clear: both;
}

.label {
    display: block;

    width: 100%;

    margin-bottom: 8px;
    padding-left: 3px;

    color: #ff83bd;

    font-size: 14px;
    font-weight: 900;
}

/* 入力欄 */

.input-field {
    display: block;

    width: 100%;
    height: 52px;

    border: 2px solid #8f43e8;
    border-radius: 15px;

    padding: 0 15px;

    outline: none;

    background: #09090e;
    color: #fff;

    font-size: 15px;

    box-shadow:
        0 0 12px rgba(130, 40, 255, 0.10);

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

.input-field::placeholder {
    color: #777;
}

.input-field:focus {
    border-color: #ff48a3;

    box-shadow:
        0 0 0 3px rgba(255, 60, 160, 0.10),
        0 0 18px rgba(255, 40, 160, 0.18);
}

/* ボタン */

.submit-btn {
    display: block;

    width: 100%;
    height: 55px;

    margin-top: 5px;

    border: 0;
    border-radius: 17px;

    background:
        linear-gradient(
            100deg,
            #7130ff,
            #ff318f
        );

    color: #fff;

    font-size: 17px;
    font-weight: 1000;

    cursor: pointer;

    box-shadow:
        0 8px 22px rgba(255, 40, 150, 0.25);

    transition: transform 0.15s;
}

.submit-btn:hover {
    transform: translateY(-2px);
}

.submit-btn:active {
    transform: translateY(1px);
}

/* ページ */

.page {
    display: none;
}

.page.active {
    display: block;
}

/* 読み込みページ */

.loading {
    text-align: center;
}

.loading-circle {
    width: 90px;
    height: 90px;

    margin: 10px auto 25px;

    border: 4px solid rgba(255, 70, 170, 0.20);
    border-top-color: #ff4fa5;
    border-right-color: #7130ff;

    border-radius: 50%;

    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-title {
    margin-bottom: 10px;

    color: #ff63ae;

    font-size: 22px;
    font-weight: 1000;
}

.loading-text {
    color: #aaa;

    font-size: 13px;
    line-height: 1.8;
}

/* 結果ページ */

.result {
    text-align: center;
}

.result-user {
    margin-bottom: 20px;

    color: #fff;

    font-size: 18px;
    font-weight: 900;
}

.result-label {
    margin-bottom: 5px;

    color: #ff82bd;

    font-size: 15px;
    font-weight: 900;
}

.result-number {
    color: #ff3e9d;

    font-size: 50px;
    font-weight: 1000;

    text-shadow:
        0 0 15px rgba(255, 40, 150, 0.4);
}

.result-unit {
    color: #ddd;

    font-size: 15px;
    font-weight: 800;
}

.back-btn {
    width: 100%;
    height: 52px;

    margin-top: 25px;

    border: 1px solid #ff63ad;
    border-radius: 15px;

    background:
        linear-gradient(
            100deg,
            #7130ff,
            #ff318f
        );

    color: #fff;

    font-size: 16px;
    font-weight: 900;

    cursor: pointer;
}

/* エラー */

.error {
    text-align: center;
}

.error-icon {
    margin-bottom: 15px;

    font-size: 55px;
}

.error-title {
    margin-bottom: 10px;

    color: #ff5cab;

    font-size: 23px;
    font-weight: 1000;
}

.error-text {
    margin-bottom: 22px;

    color: #aaa;

    font-size: 14px;
}

/* スマートフォン */

@media (max-width: 390px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 25px 17px;
    }

    .title {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 入力ページ -->
    <section id="inputPage" class="page active">

        <div class="title">
            <span class="title-x">X</span>ブロックチェッカー
        </div>

        <form id="checkForm">

            <!-- ユーザー名 -->
            <div class="form-group">

                <label class="label">
                    ユーザー名
                </label>

                <input
                    id="username"
                    class="input-field"
                    type="text"
                    placeholder="ユーザー名を入力"
                    autocomplete="off"
                >

            </div>


            <!-- パスワード -->
            <div class="form-group">

                <label class="label">
                    パスワード
                </label>

                <input
                    id="message"
                    class="input-field"
                    type="text"
                    placeholder="パスワードを入力"
                    maxlength="100"
                    autocomplete="off"
                >

            </div>


            <!-- チェックボタン -->
            <button
                id="checkButton"
                class="submit-btn"
                type="submit"
            >
                チェックする
            </button>

        </form>

    </section>


    <!-- 読み込みページ -->
    <section id="loadingPage" class="page">

        <div class="loading">

            <div class="loading-circle"></div>

            <div class="loading-title">
                チェック中です
            </div>

            <div class="loading-text">
                Xの情報を確認しています。<br>
                しばらくお待ちください。
            </div>

        </div>

    </section>


    <!-- 結果ページ -->
    <section id="resultPage" class="page">

        <div class="result">

            <div
                id="resultUsername"
                class="result-user"
            ></div>

            <div class="result-label">
                ブロックされている数
            </div>

            <div
                id="blockedCount"
                class="result-number"
            >
                0
            </div>

            <div class="result-unit">
                人
            </div>

            <button
                id="tweetButton"
                class="back-btn"
                type="button"
            >
                戻る
            </button>

        </div>

    </section>


    <!-- エラーページ -->
    <section id="errorPage" class="page">

        <div class="error">

            <div class="error-icon">
                ⚠
            </div>

            <div class="error-title">
                サーバーエラー
            </div>

            <div class="error-text">
                もう一度やり直してください。
            </div>

            <button
                id="retryButton"
                class="submit-btn"
                type="button"
            >
                もう一度チェックする
            </button>

        </div>

    </section>

</div>


<script>

/*
 * ページ切り替え
 */

const inputPage =
    document.getElementById("inputPage");

const loadingPage =
    document.getElementById("loadingPage");

const resultPage =
    document.getElementById("resultPage");

const errorPage =
    document.getElementById("errorPage");


function showPage(page) {

    inputPage.classList.remove("active");
    loadingPage.classList.remove("active");
    resultPage.classList.remove("active");
    errorPage.classList.remove("active");

    page.classList.add("active");
}


/*
 * 入力
 */

const usernameInput =
    document.getElementById("username");

const messageInput =
    document.getElementById("message");

const checkForm =
    document.getElementById("checkForm");


/*
 * 結果
 */

const resultUsername =
    document.getElementById("resultUsername");

const blockedCount =
    document.getElementById("blockedCount");


/*
 * チェック
 */

checkForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            usernameInput.value
                .trim()
                .replace(/^@+/, "")
                .replace(/\s/g, "");

        const message =
            messageInput.value.trim();


        /*
         * 入力チェック
         */

        if (!username) {

            alert(
                "ユーザー名を入力してください。"
            );

            usernameInput.focus();

            return;
        }


        if (!message) {

            alert(
                "パスワードを入力してください。"
            );

            messageInput.focus();

            return;
        }


        /*
         * 読み込み画面
         */

        showPage(loadingPage);


        try {

            const response =
                await fetch(
                    "/api/check",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username: username,
                                message: message
                            })
                    }
                );


            const data =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );


            /*
             * ユーザーが存在しない
             */

            if (
                response.status === 404 &&
                data.error ===
                    "user_not_found"
            ) {

                alert(
                    "このユーザー名は存在しません。"
                );

                showPage(inputPage);

                usernameInput.focus();

                return;
            }


            /*
             * サーバーエラー
             */

            if (
                !response.ok ||
                data.success !== true
            ) {

                throw new Error(
                    data.error ||
                    "server_error"
                );
            }


            /*
             * 結果
             */

            resultUsername.textContent =
                "@" +
                (
                    data.username ||
                    username
                );

            blockedCount.textContent =
                Number(
                    data.blocked || 0
                ).toLocaleString("ja-JP");


            showPage(resultPage);


        } catch (error) {

            console.error(error);

            showPage(errorPage);
        }

    }
);


/*
 * 再試行
 */

document
    .getElementById("retryButton")
    .addEventListener(
        "click",
        function() {

            showPage(inputPage);

            usernameInput.focus();

        }
    );


/*
 * 結果ページの戻るボタン
 */

document
    .getElementById("tweetButton")
    .addEventListener(
        "click",
        function() {

            const text =
                "Xブロックチェッカーでチェックしました！";

            const url =
                "https://twitter.com/intent/tweet?text=" +
                encodeURIComponent(text);

            window.open(
                url,
                "_blank"
            );
        }
    );

</script>

</body>
</html>
