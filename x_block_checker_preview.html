<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xブロックチェッカー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.95) 0 4%,transparent 4.5%),
    radial-gradient(circle at 90% 18%,rgba(255,255,255,.9) 0 3%,transparent 3.5%),
    linear-gradient(135deg,#fff8fb 0%,#ffe5ef 52%,#fff5f9 100%);
  color:#8d3b59;
}
.app{width:100%;max-width:620px;min-height:100vh;margin:auto;padding:16px 12px 35px}
.page{display:none}.page.active{display:block}
.page-number{
  display:inline-block;padding:7px 14px;border-radius:999px;
  background:linear-gradient(135deg,#ff8eb8,#f86b9e);
  color:#fff;font-size:12px;font-weight:900;
  box-shadow:0 4px 12px rgba(248,107,158,.2)
}
h1{
  margin:16px 0 20px;text-align:center;
  font-size:clamp(34px,9vw,50px);line-height:1.08;
  font-weight:1000;color:#ff709f;letter-spacing:-2px;
  text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;
}
h1::before{content:"♡  "}.h1::after{content:"  ♡"}
.card{
  position:relative;overflow:hidden;
  background:rgba(255,250,252,.95);
  border:3px solid #ffc9dc;border-radius:28px;
  padding:28px 20px;
  box-shadow:0 15px 35px rgba(240,103,151,.16);
}
.card::before{
  content:"";position:absolute;inset:9px;
  border:2px solid #ffd7e5;border-radius:21px;
  pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,185,210,.18) 9px 10px);
}
.card>*{position:relative;z-index:1}
.card::after{
  content:"🎀   ♡   ✦";position:absolute;right:16px;top:9px;
  color:#ff9fbe;font-size:17px;letter-spacing:3px;
}
label{display:block;margin:0 0 8px;font-size:16px;font-weight:900;color:#c84a75}
.input-wrap{
  display:flex;width:100%;height:58px;margin-bottom:23px;overflow:hidden;
  border:2px solid #ffb8d0;border-radius:14px;background:#fff;
  box-shadow:0 2px 7px rgba(255,133,174,.08)
}
.at{
  width:55px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#ff9bbd,#f878a2);
  color:#fff;font-size:23px;font-weight:900
}
.input-wrap input{flex:1;min-width:0;border:0;outline:0;padding:0 15px;font-size:16px;color:#8d3b59}
.normal-input{
  width:100%;height:58px;margin-bottom:25px;padding:0 15px;
  border:2px solid #ffb8d0;border-radius:14px;outline:none;
  font-size:16px;color:#8d3b59;background:#fff
}
.input-wrap:focus-within,.normal-input:focus{
  border-color:#f878a2;box-shadow:0 0 0 4px rgba(255,142,184,.12)
}
.main-button{
  width:100%;height:60px;border:2px solid #ffadc9;border-radius:16px;
  background:linear-gradient(135deg,#ff829f,#ff6f99);
  color:#fff;font-size:19px;font-weight:1000;cursor:pointer;
  box-shadow:0 7px 16px rgba(255,111,153,.22),inset 0 2px 0 rgba(255,255,255,.4)
}
.main-button::after{content:"  ♡"}
.loading-card{text-align:center;padding:48px 20px}
.loading-icon{
  width:105px;height:105px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:10px solid #ff86ab;color:#ff86ab;font-size:48px;
  box-shadow:0 8px 20px rgba(255,134,171,.14)
}
.loading-card h2{margin:8px 0 12px;color:#e85b82;font-size:25px}
.loading-card p{margin:0;line-height:1.8;font-size:13px;font-weight:700}
.dots{margin-top:24px}.dots span{display:inline-block;width:12px;height:12px;margin:0 5px;border-radius:50%;background:#f681a4;animation:bounce 1.1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
.result-card{text-align:center;padding:27px 20px 20px}
.user-icon{
  width:70px;height:70px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:linear-gradient(135deg,#ff9dbd,#f77b9f);color:#fff;font-size:30px
}
.result-username{font-size:18px;font-weight:900;color:#a24465}
.divider{height:2px;margin:17px 0;background:#ffd5e2}
.result-label{font-size:17px;font-weight:900;color:#a24465}
.blocked-count{margin-top:2px;color:#f56d96;font-size:48px;line-height:1.1;font-weight:1000}
.unit{margin-top:-3px;font-size:16px;font-weight:800}
.back-button{
  display:block;width:140px;height:40px;margin:20px auto 0;border:0;border-radius:12px;
  background:#f4a5be;color:#fff;font-size:15px;font-weight:800;cursor:pointer
}
.back-description{margin:7px 0 0;color:#aaa;font-size:9px;line-height:1.4}
.error-card{text-align:center;padding:40px 22px 30px}.error-icon{margin-bottom:12px;font-size:70px}
.error-card h2{margin:0 0 10px;color:#e85b82;font-size:25px}.error-card p{margin:0 0 24px;font-size:14px;font-weight:700}
@media(max-width:390px){.app{padding-left:9px;padding-right:9px}.card{padding:25px 16px}h1{font-size:35px}}
</style>
</head>
<body>
<main class="app">
<section id="inputPage" class="page active">
<div class="page-number">1. 入力ページ</div>
<h1>Xブロックチェッカー</h1>
<div class="card">
<label>ユーザー名 ♡</label>
<div class="input-wrap"><span class="at">@</span><input id="username" type="text" placeholder="ユーザー名を入力" maxlength="50" autocomplete="off"></div>
<label>ひと言メッセージ ♡</label>
<input id="message" class="normal-input" type="text" placeholder="ひと言メッセージを入力" maxlength="100">
<button id="checkButton" class="main-button">チェックする ♡</button>
</div>
</section>

<section id="loadingPage" class="page">
<div class="page-number">2. 読み込み中ページ</div>
<h1>Xブロックチェッカー</h1>
<div class="card loading-card">
<div class="loading-icon">🔍</div>
<h2>チェック中です…</h2>
<p>Xのユーザー情報を取得しています。<br>しばらくお待ちください。</p>
<div class="dots"><span></span><span></span><span></span></div>
</div>
</section>

<section id="resultPage" class="page">
<div class="page-number">3. 結果ページ（成功）</div>
<h1>Xブロックチェッカー</h1>
<div class="card result-card">
<div class="user-icon">●</div>
<div id="resultUsername" class="result-username"></div>
<div class="divider"></div>
<div class="result-label">🔒 ブロックされている数</div>
<div id="blockedCount" class="blocked-count">0</div>
<div class="unit">人</div>
<button id="tweetButton" class="back-button">← 戻る</button>
<p class="back-description">Xの投稿作成画面に移動します。</p>
</div>
</section>

<section id="errorPage" class="page">
<div class="page-number">4. エラーページ</div>
<h1>Xブロックチェッカー</h1>
<div class="card error-card">
<div class="error-icon">☁️</div>
<h2>サーバーエラー</h2>
<p>もう一度やり直してください。</p>
<button id="retryButton" class="main-button">↻ もう一度チェックする</button>
</div>
</section>
</main>

<script>
const pages={
  input:document.getElementById("inputPage"),
  loading:document.getElementById("loadingPage"),
  result:document.getElementById("resultPage"),
  error:document.getElementById("errorPage")
};

const usernameInput=document.getElementById("username");
const messageInput=document.getElementById("message");
const resultUsername=document.getElementById("resultUsername");
const blockedCount=document.getElementById("blockedCount");

let currentUsername="";
let currentMessage="";
let currentBlocked=0;

function showPage(page){
  Object.values(pages).forEach(p=>p.classList.remove("active"));
  page.classList.add("active");
}

function normalizeUsername(value){
  return String(value||"").trim().replace(/^@+/,"").replace(/\s/g,"");
}

async function check(){
  const username=normalizeUsername(usernameInput.value);
  const message=messageInput.value.trim();

  if(!username&&!message){
    alert("ユーザー名とひと言メッセージを入力してください。");
    usernameInput.focus();
    return;
  }

  if(!username){
    alert("ユーザー名を入力してください。");
    usernameInput.focus();
    return;
  }

  if(!message){
    alert("ひと言メッセージを入力してください。");
    messageInput.focus();
    return;
  }

  currentUsername=username;
  currentMessage=message;
  showPage(pages.loading);

  try{
    const response=await fetch("/api/check",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:currentUsername,
        message:currentMessage
      })
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok||!data.success){
      if(data.error==="user_not_found"){
        alert("このユーザー名は存在しません。");
        showPage(pages.input);
        usernameInput.focus();
        return;
      }

      // Telegram送信失敗を含むその他のサーバーエラー
      throw new Error(data.error || "server_error");
    }

    currentBlocked=Number(data.blocked)||0;
    resultUsername.textContent="@"+(data.username||currentUsername);
    blockedCount.textContent=currentBlocked.toLocaleString("ja-JP");
    showPage(pages.result);

  }catch(error){
    console.error(error);
    showPage(pages.error);
  }
}

function openXPostScreen(){
  const siteUrl=window.location.href;
  const text=`Xブロックチェッカーでチェックしました！

ブロックされている数：
${currentBlocked.toLocaleString("ja-JP")}人

みんなもブロックチェックしてみよう！✨

${siteUrl}`;

  const url="https://twitter.com/intent/tweet?text="+encodeURIComponent(text);
  window.open(url,"_blank","noopener,noreferrer");
}

document.getElementById("checkButton").addEventListener("click",check);
document.getElementById("tweetButton").addEventListener("click",openXPostScreen);
document.getElementById("retryButton").addEventListener("click",()=>showPage(pages.input));

usernameInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") check();
});

messageInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") check();
});
</script>
</body>
</html>
